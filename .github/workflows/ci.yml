name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Validate compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # compose.yml loads .env via env_file, so give it the committed template.
      - name: Create .env from template
        run: cp example.env .env

      - name: docker compose config
        run: docker compose config --quiet

      # Security invariant (see compose.yml comments): only n8n may publish ports.
      - name: Only n8n publishes ports
        run: |
          offenders="$(docker compose config --format json \
            | jq -r '.services | to_entries[]
                     | select(.key != "n8n" and ((.value.ports // []) | length) > 0)
                     | .key')"
          if [ -n "$offenders" ]; then
            echo "::error::These services publish ports but must stay internal: $offenders"
            exit 1
          fi

  yamllint:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: yamllint
        run: pipx run yamllint --strict .

  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck generate-secrets.sh

  generate-secrets:
    name: Test generate-secrets.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate secrets into a scratch env file
        run: |
          cp example.env "$RUNNER_TEMP/test.env"
          ./generate-secrets.sh "$RUNNER_TEMP/test.env"
      - name: Check output
        run: |
          f="$RUNNER_TEMP/test.env"
          fail() { echo "::error::$1"; exit 1; }
          get() { grep -E "^$1=" "$f" | cut -d= -f2-; }

          [ "$(stat -c %a "$f")" = 600 ] || fail "env file mode is not 600"

          for key in N8N_RUNNERS_AUTH_TOKEN SANDBOX_API_KEYS N8N_SANDBOX_SERVICE_API_KEY \
                     SANDBOX_API_RUNNER_REGISTRATION_TOKEN SANDBOX_API_RUNNER_API_KEY SEARXNG_SECRET; do
            [ "$(grep -cE "^$key=" "$f")" = 1 ] || fail "$key must appear exactly once"
            get "$key" | grep -qE '^[0-9a-f]{64}$' || fail "$key was not replaced with a 64-char hex secret"
          done

          [ "$(get SANDBOX_API_KEYS)" = "$(get N8N_SANDBOX_SERVICE_API_KEY)" ] \
            || fail "SANDBOX_API_KEYS and N8N_SANDBOX_SERVICE_API_KEY differ"

          # Non-secret lines must be left alone.
          [ "$(get N8N_VERSION)" = "$(grep -E '^N8N_VERSION=' example.env | cut -d= -f2-)" ] \
            || fail "N8N_VERSION was changed"
